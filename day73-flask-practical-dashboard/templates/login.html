<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <header>
        <h1>Log In</h1>

        <p>
            Log in to access your Enquiry Tracker.
        </p>
    </header>

    <main>
        {% if message %}
            <div class="message {{ message_type }}">
                <p>
                    {{ message }}
                </p>
            </div>
        {% endif %}

        {% if errors %}
            <div class="message error">
                <ul>
                    {% for error in errors %}
                        <li>
                            {{ error }}
                        </li>
                    {% endfor %}
                </ul>
            </div>
        {% endif %}

        <section>
            <form method="POST" action="/login">
                <label for="email">
                    Email address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    value="{{ email }}"
                >

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                >

                <button type="submit">
                    Log in
                </button>
            </form>

            <p>
                Do not have an account?
                <a href="/register">
                    Create an account
                </a>
            </p>
        </section>
    </main>

    <footer>
        <p>
            Enquiry Tracker — Day 72 practice project
        </p>
    </footer>
</body>
</html>
