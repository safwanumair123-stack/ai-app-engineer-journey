<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 18 — Loading Indicator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <h1>Day 18 — Loading Indicator</h1>

    <p>
      This practice app sends a post request to a practice API.
      While the request is running, a loading spinner appears beside
      the status message and the submit button is disabled.
    </p>

    <form id="postForm" novalidate>
      <div class="field">
        <label for="title">Post title</label>
        <input
          type="text"
          id="title"
          name="title"
          placeholder="Enter a title"
          autocomplete="off"
        >
        <p class="error" id="titleError" aria-live="polite"></p>
      </div>

      <div class="field">
        <label for="body">Post content</label>
        <textarea
          id="body"
          name="body"
          rows="5"
          placeholder="Write your post content"
        ></textarea>
        <p class="error" id="bodyError" aria-live="polite"></p>
      </div>

      <div class="actions">
        <button
          type="submit"
          id="submitBtn"
          class="primary-btn"
        >
          Send practice post
        </button>

        <button
          type="button"
          id="clearBtn"
          class="secondary-btn"
        >
          Clear form and result
        </button>
      </div>
    </form>

    <div class="status-row">
      <span
        class="spinner"
        id="spinner"
        hidden
        aria-hidden="true"
      ></span>

      <p
        class="status"
        id="status"
        role="status"
        aria-live="polite"
      ></p>
    </div>

    <section class="result" id="resultSection" hidden>
      <h2>Submitted post</h2>

      <p class="result-label">Title:</p>
      <p class="result-value" id="resultTitle"></p>

      <p class="result-label">Content:</p>
      <p class="result-value" id="resultBody"></p>

      <p class="result-label">Practice post ID:</p>
      <p class="result-value" id="resultId"></p>
    </section>

    <section class="raw-output">
      <h2>Raw API response</h2>
      <pre id="output"></pre>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
