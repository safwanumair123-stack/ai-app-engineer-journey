<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 2: Send Data to an API</title>
</head>
<body>
  <h1>Day 2: Send Data to an API</h1>

  <p>Practice only. Use fictional information.</p>

  <form id="postForm">
    <label for="title">Post title:</label><br>
    <input id="title" type="text" required maxlength="100">
    <br><br>

    <label for="body">Post content:</label><br>
    <textarea
      id="body"
      rows="5"
      cols="40"
      required
      maxlength="1000"
    ></textarea>
    <br><br>

    <button id="submitBtn" type="submit">
      Send practice post
    </button>
  </form>

  <p id="status" role="status"></p>
  <pre id="output"></pre>

  <script src="script.js"></script>
</body>
</html>
