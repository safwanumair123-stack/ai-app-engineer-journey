<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiry Tracker</title>
</head>
<body>
    <header>
        <h1>Enquiry Tracker</h1>
        <p>
            Capture customer enquiries, assign priorities,
            and track progress in one place.
        </p>
    </header>

    <main>
        <section>
            <h2>Create a new enquiry</h2>

            <form>
                <label for="customer-name">
                    Customer name
                </label>
                <input
                    type="text"
                    id="customer-name"
                    name="customer-name"
                    placeholder="Enter the customer name"
                >

                <label for="enquiry-type">
                    Enquiry type
                </label>
                <select id="enquiry-type" name="enquiry-type">
                    <option value="">Select an enquiry type</option>
                    <option value="General enquiry">General enquiry</option>
                    <option value="Quotation">Quotation</option>
                    <option value="Support">Support</option>
                    <option value="Partnership">Partnership</option>
                </select>

                <label for="priority">
                    Priority
                </label>
                <select id="priority" name="priority">
                    <option value="">Select a priority</option>
                    <option value="Low">Low</option>
                    <option value="Medium">Medium</option>
                    <option value="High">High</option>
                </select>

                <label for="enquiry-details">
                    Enquiry details
                </label>
                <textarea
                    id="enquiry-details"
                    name="enquiry-details"
                    rows="4"
                    placeholder="Enter the enquiry details"
                ></textarea>

                <label for="next-action">
                    Next action
                </label>
                <input
                    type="text"
                    id="next-action"
                    name="next-action"
                    placeholder="Enter the next action"
                >

                <button type="submit">
                    Create enquiry
                </button>

                <button type="reset">
                    Clear form
                </button>
            </form>
        </section>

        <section>
            <h2>Enquiry list</h2>

            <p>
                No enquiries have been created yet.
            </p>
        </section>
    </main>

    <footer>
        <p>
            Enquiry Tracker — Day 37 practice project
        </p>
    </footer>
</body>
</html>
